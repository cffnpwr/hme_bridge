[settings]
lockfile = true

[tools]
terraform = "1.17.1"
bun = "1.4.4"

[tasks.tf]
description = "terraform/でterraformを実行する"
dir = "{{config_root}}/terraform"
run = "terraform"

[tasks.lint]
description = "TypeScriptをESLintで検査する"
# NOTE: BunはTypeScriptの設定ファイルを直接読み込めるため、eslint.config.tsの読み込みにjitiを使わないようBunで実行する
run = "bunx --bun eslint ."
